spring:
  application:
    name: rewards-service
  datasource:
    url: jdbc:h2:mem:rewards;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Application-specific tunables. Override via env vars, e.g.
#   REWARDS_DEFAULT_WINDOW_MONTHS=6
#   SEEDER_START_DATE=2025-01-01
rewards:
  default-window-months: ${REWARDS_DEFAULT_WINDOW_MONTHS:3}

seeder:
  start-date: ${SEEDER_START_DATE:2024-11-01}
  end-date: ${SEEDER_END_DATE:2026-05-06}
  random-seed: ${SEEDER_RANDOM_SEED:42}
  min-transactions-per-customer: ${SEEDER_MIN_TX:15}
  max-transactions-per-customer: ${SEEDER_MAX_TX:40}
